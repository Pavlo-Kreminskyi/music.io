<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Павло Кремінський — офіційний сайт</title>
<meta name="description" content="Офіційний сайт музиканта Павла Кремінського">

<!-- ==================== PWA META ==================== -->
<meta name="theme-color" content="#3E0F8D">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="images/logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pavlo Kreminskyi">

<!-- PWA: manifest.json і sw.js лежать поруч з index.html. GitHub Pages сам дає HTTPS, тож "Встановити застосунок" зʼявиться в браузері автоматично. -->

<style>
/* =========================================================
   FILE: css/style.css
   (В межах одного файлу для попереднього перегляду. Щоб розділити
   проєкт — виріжте весь вміст цього тега <style> у файл css/style.css
   і підключіть його в <head> так: <link rel="stylesheet" href="css/style.css">)
   ========================================================= */

/* ---------- 1. ДИЗАЙН-ТОКЕНИ (кольорова палітра) ---------- */
:root{
  --bg:        #3E0F8D; /* головний фон */
  --card:      #2c2a50; /* фон карток / плеєра */
  --border:    #6a7da0; /* межі, лінії, роздільники */
  --text-sec:  #c0c7c2; /* другорядний текст */
  --text-pri:  #fefdf3; /* основний текст */
  --title:     #9564DD; /* назви пісень / акцент */
  --accent:    #E4DA72; /* кнопки / активні елементи */
  --lyrics:    #EEEEEE; /* текст пісень */

  --radius-lg: 24px;
  --radius-md: 16px;
  --radius-sm: 10px;
  --radius-full: 999px;

  --font-display: Georgia, "Iowan Old Style", "Times New Roman", serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

*{ box-sizing: border-box; }
html,body{ height:100%; }
html{ scroll-padding-top: var(--safe-top); }

body{
  margin:0;
  background: var(--bg);
  color: var(--text-pri);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
  overflow-x: hidden;
}

a{ color: inherit; }
button{ font-family: inherit; }

::-webkit-scrollbar{ width:8px; }
::-webkit-scrollbar-thumb{ background: var(--border); border-radius: var(--radius-full); }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}

/* ---------- 2. HEADER ---------- */
.site-header{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:16px;
  padding: 48px 24px 32px;
  text-align:center;
}

.logo-ring{
  width:120px;
  height:120px;
  border-radius:50%;
  border:1.5px solid var(--border);
  background: var(--card);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
  flex-shrink:0;
}

.logo-ring img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.logo-ring .logo-fallback{
  font-family: var(--font-display);
  font-size:36px;
  letter-spacing:2px;
  color: var(--title);
}

/* Обертання логотипу-платівки під час відтворення */
.logo-ring.is-spinning img,
.logo-ring.is-spinning .logo-fallback{
  animation: vinyl-spin 6s linear infinite;
}

@keyframes vinyl-spin{
  from{ transform: rotate(0deg); }
  to{ transform: rotate(360deg); }
}

.site-title{
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 26px;
  letter-spacing: 3px;
  margin:0;
  color: var(--text-pri);
}

.site-subtitle{
  margin:0;
  font-size:13px;
  letter-spacing:1.5px;
  color: var(--text-sec);
}

/* ---------- 3. БІБЛІОТЕКА ТРЕКІВ ---------- */
.library{
  max-width:560px;
  margin:0 auto;
  padding: 0 20px 140px;
}

.library-heading{
  font-size:13px;
  letter-spacing:1.5px;
  color: var(--text-sec);
  margin: 8px 4px 14px;
}

.track-list{
  list-style:none;
  margin:0;
  padding:0;
  border-top:1px solid var(--border);
}

.track-row{
  display:flex;
  align-items:center;
  gap:16px;
  width:100%;
  background:none;
  border:none;
  border-bottom:1px solid var(--border);
  padding:12px 6px;
  cursor:pointer;
  text-align:left;
  color:inherit;
  transition: background-color .15s ease;
  min-height:64px;
}

.track-row:hover,
.track-row:focus-visible{
  background: rgba(255,255,255,0.04);
  outline:none;
}

.track-row:focus-visible{
  box-shadow: inset 0 0 0 1.5px var(--accent);
}

.track-photo{
  width:56px;
  height:56px;
  border-radius: var(--radius-sm);
  object-fit:cover;
  flex-shrink:0;
  background: var(--card);
  border:1px solid var(--border);
}

.track-info{
  min-width:0;
  flex:1;
}

.track-title{
  font-family: var(--font-display);
  font-size:17px;
  color: var(--title);
  margin:0 0 4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.track-artist{
  font-size:13px;
  color: var(--text-sec);
  margin:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.track-row.is-playing .track-title{ color: var(--accent); }

.track-play-icon{
  width:32px;
  height:32px;
  border-radius:50%;
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  color: var(--text-sec);
}

/* ---------- 4. МІНІ-ПЛЕЄР (внизу бібліотеки) ---------- */
.mini-player{
  position:fixed;
  left:0; right:0; bottom:0;
  padding: 10px 16px calc(10px + var(--safe-bottom));
  background: var(--card);
  border-top:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:12px;
  transform: translateY(100%);
  transition: transform .25s ease;
  z-index:20;
}

.mini-player.is-visible{ transform: translateY(0); }

.mini-player img{
  width:44px; height:44px;
  border-radius: var(--radius-sm);
  object-fit:cover;
  flex-shrink:0;
}

.mini-player-info{
  flex:1;
  min-width:0;
  cursor:pointer;
}

.mini-player-title{
  font-family: var(--font-display);
  font-size:14px;
  color: var(--title);
  margin:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.mini-player-artist{
  font-size:12px;
  color: var(--text-sec);
  margin:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.icon-btn{
  width:40px; height:40px;
  border-radius:50%;
  border:1px solid var(--border);
  background:transparent;
  color: var(--text-pri);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  flex-shrink:0;
  transition: border-color .15s ease, color .15s ease, opacity .15s ease;
}
.icon-btn:hover{ border-color: var(--accent); color: var(--accent); }
.icon-btn:disabled{ opacity:.3; pointer-events:none; }

/* ---------- 5. СТОРІНКА ПІСНІ ---------- */
.song-page{
  position:fixed;
  inset:0;
  background: var(--bg);
  z-index:30;
  display:none;
  flex-direction:column;
  overflow-y:auto;
  padding: calc(20px + var(--safe-top)) 20px calc(32px + var(--safe-bottom));
}

.song-page.is-open{ display:flex; }

.back-btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  align-self:flex-start;
  background:none;
  border:none;
  color: var(--text-sec);
  font-size:14px;
  cursor:pointer;
  padding:8px 4px;
  margin-bottom:12px;
  transition: color .15s ease;
}
.back-btn:hover{ color: var(--text-pri); }

.song-page-inner{
  max-width:480px;
  width:100%;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

.song-cover{
  width:auto;
  height:28vh;
  max-height:280px;
  border-radius: var(--radius-lg);
  object-fit:cover;
  border:1px solid var(--border);
  background: var(--card);
}

.song-heading{
  margin: 22px 0 2px;
}

.song-title{
  font-family: var(--font-display);
  font-size:24px;
  color: var(--title);
  margin:0 0 6px;
}

.song-artist{
  font-size:14px;
  color: var(--text-sec);
  margin:0;
  letter-spacing:.5px;
}

/* ---------- 6. КАСТОМНИЙ ПЛЕЄР ---------- */
.player{
  width:100%;
  margin-top:28px;
}

.progress-wrap{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
}

.progress-time{
  font-size:12px;
  color: var(--text-sec);
  min-width:38px;
  font-variant-numeric: tabular-nums;
}

.progress-bar{
  flex:1;
  height:4px;
  border-radius: var(--radius-full);
  background: var(--border);
  position:relative;
  cursor:pointer;
  padding: 12px 0; /* більша зона натискання, лінія лишається тонкою */
  background-clip: content-box;
}

.progress-bar-fill{
  position:absolute;
  top:12px;
  left:0;
  height:4px;
  border-radius: var(--radius-full);
  background: var(--accent);
  width:0%;
  pointer-events:none;
}

.progress-bar-handle{
  position:absolute;
  top:50%;
  width:12px; height:12px;
  border-radius:50%;
  background: var(--accent);
  transform: translate(-50%,-50%);
  left:0%;
  pointer-events:none;
}

.controls{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:28px;
  margin-top:26px;
}

.play-btn{
  width:64px; height:64px;
  border-radius:50%;
  background: var(--accent);
  color: var(--bg);
  border:none;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  flex-shrink:0;
  transition: transform .15s ease;
}
.play-btn:hover{ transform: scale(1.04); }
.play-btn svg{ width:26px; height:26px; }

.nav-btn{
  width:44px; height:44px;
  border-radius:50%;
  border:1px solid var(--border);
  background:transparent;
  color: var(--text-pri);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition: border-color .15s ease, opacity .15s ease;
}
.nav-btn:hover{ border-color: var(--accent); }
.nav-btn:disabled{ opacity:.3; pointer-events:none; }

/* ---------- 7. ТЕКСТ ПІСНІ ---------- */
.lyrics-toggle{
  margin-top:36px;
  background:none;
  border:1px solid var(--border);
  color: var(--text-pri);
  padding:12px 22px;
  border-radius: var(--radius-full);
  font-size:14px;
  cursor:pointer;
  transition: border-color .15s ease, color .15s ease;
}
.lyrics-toggle:hover{ border-color: var(--accent); color: var(--accent); }

.lyrics-block{
  width:100%;
  margin-top:20px;
  max-height:0;
  overflow:hidden;
  transition: max-height .3s ease;
}

.lyrics-block.is-open{
  max-height:340px;
}

.lyrics-scroll{
  max-height:340px;
  overflow-y:auto;
  background: var(--card);
  border:1px solid var(--border);
  border-radius: var(--radius-md);
  padding:20px;
  text-align:left;
}

.lyrics-scroll p{
  margin:0;
  white-space:pre-line;
  color: var(--lyrics);
  font-size:15px;
  line-height:1.8;
}

/* ---------- 8. RESPONSIVE ---------- */
@media (max-width: 600px){
  .logo-ring{ width:100px; height:100px; }
  .site-title{ font-size:22px; }
  .song-cover{ height:40vh; }
  .controls{ gap:22px; }
  .play-btn{ width:60px; height:60px; }
  .track-row{ min-height:60px; padding:14px 6px; }
}

/* Приховані елементи для screen readers */
.sr-only{
  position:absolute;
  width:1px; height:1px;
  padding:0; margin:-1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
  border:0;
}
</style>
</head>
<body>

<!-- ==================== 1. HEADER ==================== -->
<header class="site-header">
  <div class="logo-ring" id="logo-ring">
    <!-- PUT YOUR LOGO HERE: images/logo.png 400x400px -->
    <img id="logo-img" src="images/logo.png" alt="Логотип Павла Кремінського"
         onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='flex';">
    <span id="logo-fallback" class="logo-fallback" style="display:none;">PK</span>
  </div>
  <h1 class="site-title">PAVLO KREMINSKYI</h1>
  <p class="site-subtitle">МУЗИКА</p>
</header>

<!-- ==================== 2. БІБЛІОТЕКА ТРЕКІВ ==================== -->
<main class="library">
  <p class="library-heading">ТРЕКИ</p>
  <ul class="track-list" id="track-list">
    <!-- Рядки треків генеруються з масиву songs у js/app.js -->
  </ul>
</main>

<!-- ==================== МІНІ-ПЛЕЄР ==================== -->
<div class="mini-player" id="mini-player">
  <img id="mini-cover" src="" alt="">
  <div class="mini-player-info" id="mini-info">
    <p class="mini-player-title" id="mini-title"></p>
    <p class="mini-player-artist" id="mini-artist"></p>
  </div>
  <button class="icon-btn" id="mini-play-btn" aria-label="Відтворити / Пауза">
    <svg id="mini-play-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
  </button>
</div>

<!-- ==================== 3. СТОРІНКА ПІСНІ ==================== -->
<section class="song-page" id="song-page">
  <button class="back-btn" id="back-btn">← Назад в бібліотеку</button>

  <div class="song-page-inner">
    <img class="song-cover" id="song-cover" src="" alt="">

    <div class="song-heading">
      <h2 class="song-title" id="song-title"></h2>
      <p class="song-artist" id="song-artist"></p>
    </div>

    <!-- Кастомний плеєр -->
    <div class="player">
      <div class="progress-wrap">
        <span class="progress-time" id="time-current">0:00</span>
        <div class="progress-bar" id="progress-bar">
          <div class="progress-bar-fill" id="progress-fill"></div>
          <div class="progress-bar-handle" id="progress-handle"></div>
        </div>
        <span class="progress-time" id="time-duration">0:00</span>
      </div>

      <div class="controls">
        <button class="nav-btn" id="prev-btn" aria-label="Попередній трек">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>

        <button class="play-btn" id="play-btn" aria-label="Відтворити / Пауза">
          <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>

        <button class="nav-btn" id="next-btn" aria-label="Наступний трек">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
        </button>
      </div>
    </div>

    <!-- Текст пісні -->
    <button class="lyrics-toggle" id="lyrics-toggle">Показати текст пісні ↓</button>
    <div class="lyrics-block" id="lyrics-block">
      <div class="lyrics-scroll">
        <p id="lyrics-text"></p>
      </div>
    </div>
  </div>
</section>

<!-- Прихований аудіо-елемент, керує відтворенням для всього сайту -->
<audio id="audio-player" preload="metadata"></audio>

<script>
// js/app.js — щоб розділити файли, виріжте весь вміст цього тега script
// у файл js/app.js і підключіть його окремим тегом перед закриттям body

// Як додати пісню:
// 1) mp3 → у папку songs/   2) обкладинка → у папку images/
// 3) назви файлів латиницею, без пробілів
// 4) скопіюйте об'єкт нижче (song2) і заповніть своїми даними, додайте в масив songs
// 5) кожній пісні — унікальний id

const song2 = {
  id: 2,
  title: "Назва другої пісні",
  artist: "Павло Кремінський",
  cover: "images/song2.jpg",
  file: "songs/song2.mp3",
  lyrics: "Текст другої пісні тут."
};
// щоб додати song2 у бібліотеку — розкоментуйте рядок нижче:
// songs.push(song2);

const songs = [
  {
    id: 1,
    title: "Назва пісні",
    artist: "Павло Кремінський",
    cover: "images/song1.jpg",
    file: "songs/song1.mp3",
    lyrics: "Тут буде текст пісні. Замініть цей рядок на реальні слова треку."
  }
];

// Стан плеєра
const audio = document.getElementById('audio-player');
let currentIndex = -1;
let isSeeking = false;

// Елементи DOM
const el = {
  logoRing: document.getElementById('logo-ring'),
  trackList: document.getElementById('track-list'),
  songPage: document.getElementById('song-page'),
  backBtn: document.getElementById('back-btn'),
  songCover: document.getElementById('song-cover'),
  songTitle: document.getElementById('song-title'),
  songArtist: document.getElementById('song-artist'),
  playBtn: document.getElementById('play-btn'),
  playIcon: document.getElementById('play-icon'),
  prevBtn: document.getElementById('prev-btn'),
  nextBtn: document.getElementById('next-btn'),
  progressBar: document.getElementById('progress-bar'),
  progressFill: document.getElementById('progress-fill'),
  progressHandle: document.getElementById('progress-handle'),
  timeCurrent: document.getElementById('time-current'),
  timeDuration: document.getElementById('time-duration'),
  lyricsToggle: document.getElementById('lyrics-toggle'),
  lyricsBlock: document.getElementById('lyrics-block'),
  lyricsText: document.getElementById('lyrics-text'),
  miniPlayer: document.getElementById('mini-player'),
  miniCover: document.getElementById('mini-cover'),
  miniTitle: document.getElementById('mini-title'),
  miniArtist: document.getElementById('mini-artist'),
  miniInfo: document.getElementById('mini-info'),
  miniPlayBtn: document.getElementById('mini-play-btn'),
  miniPlayIcon: document.getElementById('mini-play-icon'),
};

const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
const ICON_PAUSE = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';

// Рендер бібліотеки
function renderLibrary(){
  el.trackList.innerHTML = '';
  songs.forEach((song, index) => {
    const li = document.createElement('li');
    const row = document.createElement('button');
    row.className = 'track-row';
    row.dataset.index = index;
    row.setAttribute('aria-label', 'Відкрити пісню: ' + song.title);
    row.innerHTML =
      '<img class="track-photo" src="' + song.cover + '" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">' +
      '<div class="track-info">' +
        '<p class="track-title">' + song.title + '</p>' +
        '<p class="track-artist">' + song.artist + '</p>' +
      '</div>' +
      '<span class="track-play-icon" aria-hidden="true">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>' +
      '</span>';
    row.addEventListener('click', () => openSong(index));
    li.appendChild(row);
    el.trackList.appendChild(li);
  });
}

// Відкриття сторінки пісні
function openSong(index){
  const song = songs[index];
  if (!song) return;
  const isNewTrack = currentIndex !== index;
  currentIndex = index;

  el.songCover.src = song.cover;
  el.songCover.alt = song.title;
  el.songTitle.textContent = song.title;
  el.songArtist.textContent = song.artist;
  el.lyricsText.textContent = song.lyrics || '';
  el.lyricsBlock.classList.remove('is-open');
  el.lyricsToggle.textContent = 'Показати текст пісні ↓';
  el.songPage.classList.add('is-open');
  document.body.style.overflow = 'hidden';

  updateNavButtons();
  highlightActiveRow();
  updateMiniPlayer();

  if (isNewTrack){
    audio.src = song.file;
    audio.play().catch(() => {});
  } else if (audio.paused){
    audio.play().catch(() => {});
  }
}

function closeSong(){
  el.songPage.classList.remove('is-open');
  document.body.style.overflow = '';
}

function updateNavButtons(){
  el.prevBtn.disabled = currentIndex <= 0;
  el.nextBtn.disabled = currentIndex >= songs.length - 1;
}

function highlightActiveRow(){
  document.querySelectorAll('.track-row').forEach(row => {
    row.classList.toggle('is-playing', Number(row.dataset.index) === currentIndex);
  });
}

// Відтворення / пауза
function togglePlay(){
  if (currentIndex === -1) return;
  if (audio.paused){ audio.play().catch(() => {}); } else { audio.pause(); }
}

audio.addEventListener('play', () => {
  setPlayIcon(true);
  el.logoRing.classList.add('is-spinning');
  el.miniPlayer.classList.add('is-visible');
});

audio.addEventListener('pause', () => {
  setPlayIcon(false);
  el.logoRing.classList.remove('is-spinning');
});

audio.addEventListener('ended', () => {
  if (currentIndex < songs.length - 1){
    openSong(currentIndex + 1);
  } else {
    setPlayIcon(false);
    el.logoRing.classList.remove('is-spinning');
  }
});

function setPlayIcon(isPlaying){
  el.playIcon.innerHTML = isPlaying ? ICON_PAUSE : ICON_PLAY;
  el.miniPlayIcon.innerHTML = isPlaying ? ICON_PAUSE : ICON_PLAY;
}

// Прогрес-бар
function formatTime(sec){
  if (!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return m + ':' + s;
}

audio.addEventListener('timeupdate', () => { if (!isSeeking) updateProgressUI(); });
audio.addEventListener('loadedmetadata', () => {
  el.timeDuration.textContent = formatTime(audio.duration);
  updatePositionState();
});

function updateProgressUI(){
  const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
  el.progressFill.style.width = pct + '%';
  el.progressHandle.style.left = pct + '%';
  el.timeCurrent.textContent = formatTime(audio.currentTime);
  el.timeDuration.textContent = formatTime(audio.duration);
}

function seekFromEvent(clientX){
  const rect = el.progressBar.getBoundingClientRect();
  let pct = (clientX - rect.left) / rect.width;
  pct = Math.min(1, Math.max(0, pct));
  if (audio.duration){ audio.currentTime = pct * audio.duration; }
  el.progressFill.style.width = (pct * 100) + '%';
  el.progressHandle.style.left = (pct * 100) + '%';
}

el.progressBar.addEventListener('click', (e) => seekFromEvent(e.clientX));
el.progressBar.addEventListener('pointerdown', (e) => {
  isSeeking = true;
  seekFromEvent(e.clientX);
  const onMove = (ev) => seekFromEvent(ev.clientX);
  const onUp = () => {
    isSeeking = false;
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
  };
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
});

// Текст пісні: показати / сховати
el.lyricsToggle.addEventListener('click', () => {
  const isOpen = el.lyricsBlock.classList.toggle('is-open');
  el.lyricsToggle.textContent = isOpen ? 'Сховати текст ↑' : 'Показати текст пісні ↓';
});

// Кнопки керування
el.playBtn.addEventListener('click', togglePlay);
el.miniPlayBtn.addEventListener('click', togglePlay);
el.miniInfo.addEventListener('click', () => { if (currentIndex !== -1) openSong(currentIndex); });
el.prevBtn.addEventListener('click', () => { if (currentIndex > 0) openSong(currentIndex - 1); });
el.nextBtn.addEventListener('click', () => { if (currentIndex < songs.length - 1) openSong(currentIndex + 1); });
el.backBtn.addEventListener('click', closeSong);

// Міні-плеєр
function updateMiniPlayer(){
  const song = songs[currentIndex];
  if (!song) return;
  el.miniCover.src = song.cover;
  el.miniTitle.textContent = song.title;
  el.miniArtist.textContent = song.artist;
}

// Фонове відтворення + Media Session API
function setupMediaSession(){
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.setActionHandler('play', () => audio.play().catch(() => {}));
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('previoustrack', () => { if (currentIndex > 0) openSong(currentIndex - 1); });
  navigator.mediaSession.setActionHandler('nexttrack', () => { if (currentIndex < songs.length - 1) openSong(currentIndex + 1); });
  navigator.mediaSession.setActionHandler('seekto', (details) => {
    if (details.fastSeek && 'fastSeek' in audio){ audio.fastSeek(details.seekTime); return; }
    audio.currentTime = details.seekTime;
  });
}

function updateMediaSessionMetadata(){
  if (!('mediaSession' in navigator)) return;
  const song = songs[currentIndex];
  if (!song) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: song.title,
    artist: song.artist,
    album: 'Pavlo Kreminskyi',
    artwork: [{ src: song.cover, sizes: '512x512', type: 'image/jpeg' }]
  });
}

function updatePositionState(){
  if (!('mediaSession' in navigator) || !('setPositionState' in navigator.mediaSession)) return;
  if (!isFinite(audio.duration)) return;
  navigator.mediaSession.setPositionState({ duration: audio.duration, playbackRate: audio.playbackRate, position: audio.currentTime });
}

audio.addEventListener('loadedmetadata', updateMediaSessionMetadata);
audio.addEventListener('timeupdate', updatePositionState);

// Реєстрація service worker (потрібно для встановлення як застосунок)
if ('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

// Старт
renderLibrary();
setupMediaSession();
</script>
</body>
